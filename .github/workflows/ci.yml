name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CI: 'true'
  NX_DAEMON: 'false'

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for Nx affected
        if: github.event_name == 'pull_request'
        run: git fetch origin master:master --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn affected:lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook

